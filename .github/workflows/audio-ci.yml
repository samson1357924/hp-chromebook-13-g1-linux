name: Audio Subsystem CI (Scripts & UCM Patching)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'audio/**'
      - 'tests/audio-ucm-pcm-index-test.sh'
      - '.github/workflows/audio-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'audio/**'
      - 'tests/audio-ucm-pcm-index-test.sh'
      - '.github/workflows/audio-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# NOTE: the repo no longer mirrors UCM profiles (audio/ucm/ucm2) nor ships
# kernel patches (audio/patches/) - install-audio.sh patches the distro UCM
# in place instead. This workflow guards the audio scripts and the UCM PCM
# index fix (hw:${CardId},1|,2 -> hw:${CardId},0) that keeps the SSM4567
# speaker and DMIC capture working on kernels >= 6.16.
jobs:
  audio-scripts-and-ucm:
    name: Audio Scripts & UCM PCM Index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bash Syntax Check (audio scripts)
        run: |
          set -euo pipefail
          for f in audio/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: UCM PCM Index Patch Regression (sandboxed, no root)
        run: bash tests/audio-ucm-pcm-index-test.sh
