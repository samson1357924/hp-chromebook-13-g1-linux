name: Hardware Issue Report
description: Report a hardware or driver issue on HP Chromebook 13 G1
title: "[Bug]: "
labels: ["bug", "hardware"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please provide detailed diagnostic information to help diagnose hardware problems.
  - type: input
    id: os_info
    attributes:
      label: Linux Distribution & Version
      placeholder: e.g. Ubuntu 26.04 LTS, Fedora 45, Arch Linux
    validations:
      required: true
  - type: input
    id: kernel_version
    attributes:
      label: Kernel Version (`uname -r`)
      placeholder: e.g. 7.0.0-29-generic
    validations:
      required: true
  - type: input
    id: dmi_info
    attributes:
      label: DMI / Board Name (`cat /sys/class/dmi/id/product_name`)
      placeholder: e.g. Chell / HP Chromebook 13 G1
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: What went wrong?
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
        ## 🔇 Audio-specific (fill if the issue is audio-related)
  - type: textarea
    id: audio_soundcards
    attributes:
      label: Sound Cards (`aplay -l` — use ALSA IDs, card numbers are dynamic)
      description: Expected cards are `SSM4567` (speaker), `NAU8825` (headphone), `DMIC`, `HDMI` via `snd_soc_avs`.
      placeholder: |
        **** List of PLAYBACK Hardware Devices ****
        card 0: HDMI [HDA Intel HDMI]
        card 1: SSM4567 [SSM4567]
        card 2: NAU8825 [NAU8825]
        card 3: DMIC [DMIC]
      render: shell
  - type: textarea
    id: audio_ucm_files
    attributes:
      label: UCM Files Check (`ls -l /usr/share/alsa/ucm2/conf.d/avs_*/` and `/usr/share/alsa/ucm2/Intel/avs/`)
      description: |
        Missing files here = root cause of Dummy Output (see audio/docs/root-cause.md).
        Expected: conf.d/avs_ssm4567/, conf.d/avs_nau8825/, conf.d/avs_dmic/, conf.d/avs_hdaudio/ + Intel/avs fallbacks.
      placeholder: |
        /usr/share/alsa/ucm2/conf.d/avs_ssm4567/AVS I2S SSM4567.conf
        /usr/share/alsa/ucm2/Intel/avs/avs_ssm4567/Hewlett_Packard-Chell-*.conf
      render: shell
  - type: textarea
    id: audio_wpctl
    attributes:
      label: PipeWire Status (`wpctl status` — look for SSM4567/NAU8825 sinks)
      description: Dummy Output appears when no real sink exists.
      placeholder: |
        Sinks:
           48. SSM4567 [vol: 1.00]
           49. NAU8825 [vol: 1.00]
      render: shell
  - type: textarea
    id: audio_dmesg_sof
    attributes:
      label: AVS Kernel Log (`dmesg | grep -i -E 'avs|ssm4567|nau8825'`)
      description: |
        Clean output (no FW errors) rules out firmware issues. See audio/docs/root-cause.md.
      render: shell
  - type: checkboxes
    id: audio_matrix
    attributes:
      label: Audio Test Matrix (UCM present × headphone plugged)
      description: Check each scenario you have tested.
      options:
        - label: UCM missing + headphones unplugged → Dummy Output / profile=off
        - label: UCM missing + headphones plugged → only headphone path audible
        - label: UCM present + headphones unplugged → Speaker (SSM4567) profile available
        - label: UCM present + headphones plugged → auto-switch to Headphone (NAU8825)
  - type: textarea
    id: logs
    attributes:
      label: Relevant System Logs / Diagnostic Output
      description: Paste output of `./scripts/detect-hardware.sh`, `./audio/diagnose-audio.sh` or `journalctl --user -u wireplumber -e`
      render: shell
