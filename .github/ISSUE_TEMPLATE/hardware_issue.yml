name: Hardware Issue Report
description: Report a hardware or driver issue on HP Chromebook 13 G1
title: "[Bug]: "
labels: ["bug", "hardware"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please provide detailed diagnostic information to help diagnose hardware problems.
  - type: input
    id: os_info
    attributes:
      label: Linux Distribution & Version
      placeholder: e.g. Ubuntu 26.04 LTS, Fedora 45, Arch Linux
    validations:
      required: true
  - type: input
    id: kernel_version
    attributes:
      label: Kernel Version (`uname -r`)
      placeholder: e.g. 7.0.0-29-generic
    validations:
      required: true
  - type: input
    id: dmi_info
    attributes:
      label: DMI / Board Name (`cat /sys/class/dmi/id/product_name`)
      placeholder: e.g. Chell / HP Chromebook 13 G1
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: What went wrong?
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
        ## 🔇 Audio-specific (fill if the issue is audio-related)
  - type: textarea
    id: audio_soundcards
    attributes:
      label: Sound Cards (`aplay -l` — use ALSA IDs, card numbers are dynamic)
      description: |
        Expected cards are `SSM4567` (speaker), `NAU8825` (headphone), `DMIC`, `HDMI` via `snd_soc_avs`
        (kernel >= 6.16 long names: `AVS I2S SSM4567`, `AVS I2S NAU8825`, `AVS DMIC`, `AVS HDMI`).
        SSM4567/NAU8825/DMIC expose PCM device `0` only; the HDMI card (`avs_hdaudio`) keeps devices 0-2
        (HDMI1-HDMI3) — report any other mismatch.
      placeholder: |
        **** List of PLAYBACK Hardware Devices ****
        card 0: NAU8825 [AVS I2S NAU8825], device 0
        card 2: HDMI [AVS HDMI], device 0-2
        card 4: SSM4567 [AVS I2S SSM4567], device 0
      render: shell
  - type: textarea
    id: audio_ucm_files
    attributes:
      label: UCM Files Check (`ls -l /usr/share/alsa/ucm2/conf.d/avs_*/` and `/usr/share/alsa/ucm2/Intel/avs/`)
      description: |
        Missing `conf.d` fallback symlinks make `alsaucm` fail (`-2`) — one historical root cause of Dummy Output.
        On kernel >= 6.16 the main cause is a stale PCM index: the UCM `PlaybackPCM`/`CapturePCM` still references
        `hw:${CardId},1` (SSM4567/NAU8825) or `,2` (DMIC) while the kernel exposes device `0` only; the ACP HiFi
        profile then fails to build and PipeWire shows only `Dummy Output`. See `audio/docs/root-cause.md`.
        Expected: conf.d/avs_ssm4567/, conf.d/avs_nau8825/, conf.d/avs_dmic/, conf.d/avs_hdaudio/ + Intel/avs SSM4567/NAU8825/DMIC files with device `0` (HDMI UCM keeps devices 0-2).
      placeholder: |
        /usr/share/alsa/ucm2/conf.d/avs_ssm4567/AVS I2S SSM4567.conf
        /usr/share/alsa/ucm2/Intel/avs/avs_ssm4567/Hewlett_Packard-Chell-*.conf
      render: shell
  - type: textarea
    id: audio_wpctl
    attributes:
      label: PipeWire Status (`wpctl status` — Sinks/Sources, plus `pw-dump` card profiles)
      description: |
        Only `Dummy Output` (auto_null) means no real sink exists; `pw-dump` then shows the AVS cards with
        profiles `{off, pro-audio}` and active profile `off`. A stale UCM PCM index is the usual cause.
      placeholder: |
        Sinks:
        *   62. Built-in Speakers (SSM4567)  [vol: 0.50]
        Sources:
        *   61. Internal Digital Mic (DMIC) [vol: 0.55]
      render: shell
  - type: textarea
    id: audio_dmesg_sof
    attributes:
      label: AVS Kernel Log (`dmesg | grep -i -E 'avs|ssm4567|nau8825'`)
      description: |
        Clean output (no FW errors) rules out firmware issues. See audio/docs/root-cause.md.
      render: shell
  - type: checkboxes
    id: audio_matrix
    attributes:
      label: Audio Test Matrix (UCM state × headphone plugged)
      description: Check each scenario you have tested.
      options:
        - label: Stale UCM PCM index (`,1`/`,2`) + kernel >= 6.16 → Dummy Output / card profiles `off`
        - label: Patched UCM (audio/install-audio.sh), headphones unplugged → Speaker (SSM4567) HiFi sink present
        - label: Patched UCM (audio/install-audio.sh), headphones plugged → Headphone (NAU8825) expected (auto-switch not fully verified)
        - label: Sink present but volume very low (`wpctl get-volume @DEFAULT_AUDIO_SINK@` < 0.2)
  - type: textarea
    id: logs
    attributes:
      label: Relevant System Logs / Diagnostic Output
      description: Paste output of `./audio/diagnose-audio.sh` (preferred), `./scripts/detect-hardware.sh` or `journalctl --user -u wireplumber -e`
      render: shell
