# /etc/modprobe.d/99-hp-chell-power.conf
# HP Chromebook 13 G1 (Chell, Skylake-Y HD Graphics 515) Graphics & Wireless Tuning
#
# Chell verified: enable_psr=0 enable_fbc=0 enable_dc=0 fixes FIFO underrun on QHD+ eDP
# (see README.md ##3 Root Cause - CDCLK 337.5 -> 450MHz).
# Do NOT enable FBC/DC/PSR on this panel; they cause underrun with 361.31MHz pixel clock.
#
# NOTE (kernel >= 7.0): iwlwifi "d0i3_disable" was REMOVED upstream — do not re-add.

# i915: fix Chell QHD+ eDP (361.31MHz) - requires CDCLK >=450MHz; PSR/FBC/DC conflict with MrChromebox GOP/VBT
options i915 enable_psr=0 enable_fbc=0 enable_dc=0

# iwlwifi: power saving while keeping low latency
options iwlwifi power_save=1 uapsd_disable=0
