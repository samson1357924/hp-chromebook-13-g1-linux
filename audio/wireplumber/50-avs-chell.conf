# /etc/wireplumber/wireplumber.conf.d/50-avs-chell.conf
# HP Chromebook 13 G1 (Chell) - AVS multi-card priority & naming
# Deployed by audio/install-audio.sh
# Priority: Headphones (NAU8825) 2000 > Speakers (SSM4567) 1500 > HDMI 500
# Without this, HDMI (card 2) and Speakers (card 4) both at 1000 and HDMI wins by enumeration order.

monitor.alsa.rules = [
  # 1. Built-in stereo speakers (SSM4567) - default local output
  {
    matches = [
      { node.name = "~alsa_output.*avs_ssm4567.*" }
    ]
    actions = {
      update-props = {
        node.description = "Built-in Speakers (SSM4567)"
        node.nick = "Speakers"
        priority.session = 1500
        priority.driver = 1500
      }
    }
  },
  # 2. 3.5mm headphones (NAU8825) - higher than speakers for auto-switch on jack plug
  {
    matches = [
      { node.name = "~alsa_output.*avs_nau8825.*" }
    ]
    actions = {
      update-props = {
        node.description = "Headphones (NAU8825)"
        node.nick = "Headphones"
        priority.session = 2000
        priority.driver = 2000
      }
    }
  },
  # 3. HDMI outputs (avs_hdaudio) - lower priority so it never hijacks default sink
  {
    matches = [
      { node.name = "~alsa_output.*avs_hdaudio.*" }
    ]
    actions = {
      update-props = {
        node.description = "HDMI Audio Output"
        node.nick = "HDMI"
        priority.session = 500
        priority.driver = 500
      }
    }
  },
  # 4. Internal DMIC
  {
    matches = [
      { node.name = "~alsa_input.*avs_dmic.*" }
    ]
    actions = {
      update-props = {
        node.description = "Internal Digital Mic (DMIC)"
        node.nick = "Internal Mic"
        priority.session = 1500
        priority.driver = 1500
      }
    }
  },
  # 5. Headset mic (NAU8825)
  {
    matches = [
      { node.name = "~alsa_input.*avs_nau8825.*" }
    ]
    actions = {
      update-props = {
        node.description = "Headset Microphone (NAU8825)"
        node.nick = "Headset Mic"
        priority.session = 2000
        priority.driver = 2000
      }
    }
  },
  # 6. Device pretty names
  {
    matches = [{ device.name = "~alsa_card.*avs_ssm4567.*" }]
    actions = { update-props = { device.description = "Speaker Audio (SSM4567)", device.nick = "SSM4567" } }
  },
  {
    matches = [{ device.name = "~alsa_card.*avs_nau8825.*" }]
    actions = { update-props = { device.description = "Headset Audio (NAU8825)", device.nick = "NAU8825" } }
  },
  {
    matches = [{ device.name = "~alsa_card.*avs_hdaudio.*" }]
    actions = { update-props = { device.description = "HDMI Audio", device.nick = "HDMI" } }
  },
  {
    matches = [{ device.name = "~alsa_card.*avs_dmic.*" }]
    actions = { update-props = { device.description = "Internal Mic (DMIC)", device.nick = "DMIC" } }
  }
]
