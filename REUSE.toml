# REUSE.toml configuration for HP Chromebook 13 G1 Linux project

version = 1

SPDX-PackageName = "hp-chromebook-13-g1-linux"
SPDX-PackageSupplier = "Samson <https://github.com/samson1357924>"
SPDX-PackageDownloadLocation = "https://github.com/samson1357924/hp-chromebook-13-g1-linux"

# Root orchestrator and core tooling scripts
[[annotations]]
path = [
    "setup.sh",
    "scripts/**",
    "lib/**",
    "keyboard/install-keyboard.sh",
    "keyboard/keyd/**",
    "power/**",
    "ec/**",
    "audio/install-audio.sh",
    "audio/install-audio-ucm.sh",
    "audio/diagnose-audio.sh",
    "github_bot/**"
]
SPDX-FileCopyrightText = "2026 Samson <https://github.com/samson1357924>"
SPDX-License-Identifier = "MIT"

# Keyboard hwdb mapping data (derived from systemd 60-chromebook-keyboard.hwdb)
[[annotations]]
path = "keyboard/90-chromebook-keyboard.hwdb"
SPDX-FileCopyrightText = "2026 Samson <https://github.com/samson1357924>"
SPDX-License-Identifier = "CC0-1.0"

# CI workflows and issue templates
[[annotations]]
path = ".github/**"
SPDX-FileCopyrightText = "2026 Samson <https://github.com/samson1357924>"
SPDX-License-Identifier = "MIT"

# License text copy at repository root (GNU LGPL v2.1 text)
[[annotations]]
path = "COPYING.LGPL"
SPDX-FileCopyrightText = "1989, 1991 Free Software Foundation, Inc."
SPDX-License-Identifier = "LGPL-2.1-or-later"

# Audio UCM Configurations
[[annotations]]
path = "audio/ucm/**"
SPDX-FileCopyrightText = [
    "2019 Advanced Linux Sound Architecture (ALSA) project",
    "2022-2026 WeirdTreeThing <https://github.com/WeirdTreeThing>"
]
SPDX-License-Identifier = "BSD-3-Clause"

# Documentation and Guides
[[annotations]]
path = ["docs/**", "**/*.md", "*.md"]
SPDX-FileCopyrightText = "2026 Samson <https://github.com/samson1357924>"
SPDX-License-Identifier = "MIT"

# Dotfiles and linter configurations
[[annotations]]
path = [
    ".gitignore",
    ".markdownlint.yaml",
    ".markdownlint-cli2.jsonc",
    ".shellcheckrc",
    "lychee.toml",
    "mkdocs.yml",
    "requirements-docs.txt"
]
SPDX-FileCopyrightText = "2026 Samson <https://github.com/samson1357924>"
SPDX-License-Identifier = "CC0-1.0"

# MkDocs overrides and assets
[[annotations]]
path = [
    "overrides/**",
    "docs/stylesheets/**",
    "docs/assets/**"
]
SPDX-FileCopyrightText = "2026 Samson <https://github.com/samson1357924>"
SPDX-License-Identifier = "CC0-1.0"

# Audio WirePlumber profile for AVS Chell topology
[[annotations]]
path = "audio/wireplumber/**"
SPDX-FileCopyrightText = "2026 Samson <https://github.com/samson1357924>"
SPDX-License-Identifier = "MIT"
