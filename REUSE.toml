# REUSE.toml configuration for HP Chromebook 13 G1 Linux project

version = 1

SPDX-PackageName = "hp-chromebook-13-g1-linux"
SPDX-PackageSupplier = "Samson <https://github.com/samson1357924>"
SPDX-PackageDownloadLocation = "https://github.com/samson1357924/hp-chromebook-13-g1-linux"

# Root orchestrator and core tooling scripts
[[annotations]]
path = [
    "setup.sh",
    "scripts/**",
    "lib/**",
    "keyboard/install-keyboard.sh",
    "keyboard/keyd/**",
    "power/**",
    "ec/**",
    "audio/install-audio.sh",
    "audio/install-audio-ucm.sh",
    "audio/diagnose-audio.sh",
    "github_bot/**"
]
SPDX-FileCopyrightText = "2026 Samson <https://github.com/samson1357924>"
SPDX-License-Identifier = "MIT"

# Keyboard hwdb mapping data (derived from systemd 60-chromebook-keyboard.hwdb)
[[annotations]]
path = "keyboard/90-chromebook-keyboard.hwdb"
SPDX-FileCopyrightText = "2026 Samson <https://github.com/samson1357924>"
SPDX-License-Identifier = "CC0-1.0"

# CI workflows and issue templates
[[annotations]]
path = ".github/**"
SPDX-FileCopyrightText = "2026 Samson <https://github.com/samson1357924>"
SPDX-License-Identifier = "MIT"

# Documentation and Guides (markdown only; assets are CC0)
[[annotations]]
path = ["docs/**/*.md", "docs/*.md", "**/*.md", "*.md"]
SPDX-FileCopyrightText = "2026 Samson <https://github.com/samson1357924>"
SPDX-License-Identifier = "MIT"

# Security and community (MIT to avoid conflict with docs/**/*.md)
[[annotations]]
path = ["SECURITY.md", "CODE_OF_CONDUCT.md"]
SPDX-FileCopyrightText = "2026 Samson <https://github.com/samson1357924>"
SPDX-License-Identifier = "MIT"

# Mailmap (CC0 for non-code mapping)
[[annotations]]
path = [".mailmap"]
SPDX-FileCopyrightText = "2026 Samson <https://github.com/samson1357924>"
SPDX-License-Identifier = "CC0-1.0"

# Dotfiles and linter configurations
[[annotations]]
path = [
    ".gitignore",
    ".markdownlint.yaml",
    ".markdownlint-cli2.jsonc",
    ".shellcheckrc",
    "lychee.toml",
    "mkdocs.yml",
    "requirements-docs.txt"
]
SPDX-FileCopyrightText = "2026 Samson <https://github.com/samson1357924>"
SPDX-License-Identifier = "CC0-1.0"

# MkDocs overrides and assets (binary / style assets are CC0)
[[annotations]]
path = [
    "overrides/**",
    "docs/stylesheets/**",
    "docs/assets/**"
]
SPDX-FileCopyrightText = "2026 Samson <https://github.com/samson1357924>"
SPDX-License-Identifier = "CC0-1.0"

# Audio WirePlumber profile for AVS Chell topology
[[annotations]]
path = "audio/wireplumber/**"
SPDX-FileCopyrightText = "2026 Samson <https://github.com/samson1357924>"
SPDX-License-Identifier = "MIT"

# Top-level license umbrella and package metadata
[[annotations]]
path = ["LICENSE", "pyproject.toml", "tests/**", ".env.example"]
SPDX-FileCopyrightText = "2026 Samson <https://github.com/samson1357924>"
SPDX-License-Identifier = "MIT"
